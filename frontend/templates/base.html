<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Optimizer</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <span class="app-logo">Resume Optimizer</span>
      <nav class="header-nav">
        <a href="/profile" class="{% if page == 'profile' %}active{% endif %}">Profile</a>
        <a href="/analyze" class="{% if page == 'analyze' %}active{% endif %}">Analyze</a>
        <a href="/projects" class="{% if page == 'projects' %}active{% endif %}">Projects</a>
        <a href="/settings" class="{% if page == 'settings' %}active{% endif %}">Settings</a>
      </nav>
    </div>
  </header>
  <div class="app-body">
    {% block content %}{% endblock %}
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
