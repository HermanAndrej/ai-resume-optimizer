<div class="section-card">
  <h2 class="section-title">Skills</h2>
  {% if saved %}<div class="banner success">Saved.</div>{% endif %}
  <form hx-put="/profile/sections/skills" hx-target="#section-content" hx-swap="innerHTML">
    <div id="skills-container">
      {% for group in groups %}
        {% include "sections/partials/_skill_row.html" %}
      {% else %}
        <p class="empty-hint">No skills yet. Add a category below.</p>
      {% endfor %}
    </div>
    <button type="button" class="btn-ghost"
      hx-get="/profile/sections/skills/new-row"
      hx-target="#skills-container"
      hx-swap="beforeend">+ Add Category</button>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Save</button>
      <span class="unsaved-hint" id="unsaved-hint" style="display:none">Unsaved changes</span>
    </div>
  </form>
</div>
