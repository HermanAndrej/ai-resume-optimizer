{% extends "layout.html" %}

{% block title %}Education{% endblock %}

{% block content %}
<h2>Education</h2>

<div id="education-list">
    {% for entry in entries %}
        {% include "profile/_education_entry.html" %}
    {% endfor %}
</div>

<button type="button"
        class="secondary"
        hx-post="/profile/education"
        hx-target="#education-list"
        hx-swap="beforeend"
        style="margin-top: 16px;">Add education</button>
{% endblock %}
