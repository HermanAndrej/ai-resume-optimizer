{% extends "layout.html" %}

{% block title %}Personal Info{% endblock %}

{% block content %}
<h2>Personal Info</h2>

{% include "profile/_personal_form.html" %}

<section class="section-group" style="margin-top: 24px;">
    <h3>Links</h3>
    <p class="muted">LinkedIn, GitHub, portfolio, etc.</p>

    <div id="links-list" class="list-group">
        {% for link in links %}
            {% include "profile/_link_row.html" %}
        {% endfor %}
    </div>

    <form hx-post="/profile/personal/links"
          hx-target="#links-list"
          hx-swap="beforeend"
          hx-on::after-request="if (event.detail.successful) this.reset()"
          style="margin-top: 12px;">
        <div class="list-row">
            <input type="text" name="label" placeholder="Label (e.g. GitHub)" required>
            <input type="url" name="url" placeholder="https://..." required>
            <button type="submit" class="secondary">Add link</button>
        </div>
    </form>
</section>
{% endblock %}
