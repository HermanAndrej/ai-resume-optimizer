{% extends "layout.html" %}

{% block title %}Certifications{% endblock %}

{% block content %}
<h2>Certifications</h2>

<div id="certifications-list">
    {% for entry in entries %}
        {% include "profile/_certification_entry.html" %}
    {% endfor %}
</div>

<button type="button"
        class="secondary"
        hx-post="/profile/certifications"
        hx-target="#certifications-list"
        hx-swap="beforeend"
        style="margin-top: 16px;">Add certification</button>
{% endblock %}
