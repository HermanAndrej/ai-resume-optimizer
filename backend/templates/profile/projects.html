{% extends "layout.html" %}

{% block title %}Projects{% endblock %}

{% block content %}
<h2>Projects</h2>

<div id="projects-list">
    {% for entry in entries %}
        {% include "profile/_project_entry.html" %}
    {% endfor %}
</div>

<button type="button"
        class="secondary"
        hx-post="/profile/projects"
        hx-target="#projects-list"
        hx-swap="beforeend"
        style="margin-top: 16px;">Add project</button>
{% endblock %}
